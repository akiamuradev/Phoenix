[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/synnoema-core",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["akiamuradev"]
repository = "https://github.com/akiamuradev/Synnoema-Workspace"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
